<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MovieZone — Вход</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="auth-container">

        <!-- LEFT -->

        <section class="auth-left">

            <div class="logo">
                MOVIE<span>ZONE</span>
            </div>

            <div class="auth-left-content">

                <div class="movie-icon">
                    <i class="fa-solid fa-film"></i>
                </div>

                <h1>
                    Смотри.<br>
                    <span>Выбирай.</span><br>
                    Наслаждайся.
                </h1>

                <p>
                    Твоя персональная коллекция кино
                    в одном месте. Находи интересные
                    фильмы и возвращайся к любимым.
                </p>

                <div class="auth-features">

                    <div class="auth-feature">
                        <i class="fa-solid fa-check"></i>
                        Новинки и популярные фильмы
                    </div>

                    <div class="auth-feature">
                        <i class="fa-solid fa-check"></i>
                        Персональная коллекция
                    </div>

                    <div class="auth-feature">
                        <i class="fa-solid fa-check"></i>
                        Удобная история просмотров
                    </div>

                </div>

            </div>

        </section>


        <!-- RIGHT -->

        <section class="auth-right">

            <h2 class="auth-title">
                Добро пожаловать
            </h2>

            <p class="auth-subtitle">
                Войди в свой аккаунт MovieZone
            </p>


            <form
                id="loginForm"
                class="auth-form"
            >

                <div class="input-group">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="input-group">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Пароль"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Войти
                </button>

            </form>


            <div class="auth-switch">

                Нет аккаунта?

                <a href="register.html">
                    Регистрация
                </a>

            </div>

        </section>

    </div>


    <script src="login.js"></script>

</body>

</html>
